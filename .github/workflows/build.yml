name: Build RM AC2100 OpenWrt firmware

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt release to build from"
        required: false
        default: "24.10.2"
      include_luci:
        description: "Include LuCI web UI (true/false)"
        required: false
        default: "true"
      fw_version:
        description: "Firmware version stamp (written to /etc/campus-fix-version and artifact name)"
        required: false
        default: "2.12.0"

env:
  PROFILE: xiaomi_redmi-router-ac2100
  TARGET: ramips/mt7621

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get clean
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils zstd ca-certificates busybox python3 cmake pkg-config libjson-c-dev squashfs-tools
          # 邻传二维码测试的参考实现（Nayuki qrcodegen，纯 Python）
          python3 -m pip install --user --break-system-packages qrcodegen==1.8.0

      - name: Build firmware-matching ucode, libubox and uhttpd for native tests
        run: |
          # 与固件同版本（见 manifest）：ucode 2025.07.18~3f64c808、libubox 2025.07.23~49056d17、
          # uhttpd 2025.07.06~7e64e8ba。去掉 -Werror：宿主机 GCC 比固件工具链新，新告警不应阻断测试构建。
          # libubox 会写 -Werror=implicit-function-declaration 这类带值的选项，只删 -Werror
          # 会留下孤立的 =xxx，被 GCC 当链接输入报错；统一替换为 -Wno-error=<具体项> 或 -Wno-error。
          fetch() {
            mkdir -p "/tmp/src/$1"
            curl -fL --retry 3 "https://github.com/$2/archive/$3.tar.gz" -o "/tmp/src/$1.tar.gz"
            tar -xzf "/tmp/src/$1.tar.gz" --strip-components=1 -C "/tmp/src/$1"
            sed -i -E 's/-Werror=([a-zA-Z0-9-]+)/-Wno-error=\1/g; s/-Werror([^=]|$)/-Wno-error\1/g' "/tmp/src/$1/CMakeLists.txt"
          }
          fetch libubox openwrt/libubox 49056d17
          fetch ucode jow-/ucode 3f64c808
          fetch uhttpd openwrt/uhttpd 7e64e8ba
          cmake -S /tmp/src/libubox -B /tmp/build/libubox -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_LUA=OFF -DBUILD_EXAMPLES=OFF
          cmake --build /tmp/build/libubox -j2
          sudo cmake --install /tmp/build/libubox
          cmake -S /tmp/src/ucode -B /tmp/build/ucode -DCMAKE_INSTALL_PREFIX=/usr \
            -DUBUS_SUPPORT=OFF -DUCI_SUPPORT=OFF -DULOOP_SUPPORT=OFF -DRTNL_SUPPORT=OFF -DNL80211_SUPPORT=OFF \
            -DDIGEST_SUPPORT=OFF -DZLIB_SUPPORT=OFF -DDEBUG_SUPPORT=OFF -DLOG_SUPPORT=OFF
          cmake --build /tmp/build/ucode -j2
          sudo cmake --install /tmp/build/ucode
          cmake -S /tmp/src/uhttpd -B /tmp/build/uhttpd -DTLS_SUPPORT=OFF -DLUA_SUPPORT=OFF -DUBUS_SUPPORT=OFF -DUCODE_SUPPORT=OFF
          cmake --build /tmp/build/uhttpd -j2
          sudo ldconfig
          /usr/bin/ucode -e "import * as socket from 'socket'; import { stat } from 'fs'; print('ucode fs+socket ok\n');"
          echo "UCODE_BIN=/usr/bin/ucode" >> "$GITHUB_ENV"
          echo "UHTTPD_BIN=/tmp/build/uhttpd/uhttpd" >> "$GITHUB_ENV"

      - name: Test campus overlay regressions
        run: |
          python3 tests/test_review_fixes.py
          python3 tests/test_native_ucode.py
          python3 tests/test_lan_transfer.py
          python3 tests/test_lan_speed.py

      - name: Test LAN transfer on real uhttpd, native ucode and STUN in real browsers
        run: |
          npm install --prefix /tmp/lt-browser --no-audit --no-fund playwright@1.62.1
          /tmp/lt-browser/node_modules/.bin/playwright install --with-deps chromium
          # 绑定本机主网卡地址（相当于路由器 LAN 口），按固件 init 脚本的同一组 uhttpd 参数启动
          LAN_IP=$(hostname -I | awk '{print $1}')
          CMD=$(python3 tests/test_lan_transfer.py --stage /tmp/lt/www --bind "$LAN_IP" --port 8765)
          echo "$CMD"
          $CMD > /tmp/lt-uhttpd.log 2>&1 &
          UHTTPD_PID=$!
          /usr/bin/ucode /tmp/lt/stun.uc "$LAN_IP" 3478 > /tmp/lt-stun.log 2>&1 &
          STUN_PID=$!
          trap 'kill "$UHTTPD_PID" "$STUN_PID" 2>/dev/null || true; cat /tmp/lt-uhttpd.log /tmp/lt-stun.log' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS "http://$LAN_IP:8765/" -o /dev/null && break
            sleep 1
          done
          python3 tests/test_lan_transfer.py --smoke "http://$LAN_IP:8765"
          NODE_PATH=/tmp/lt-browser/node_modules LAN_TRANSFER_URL="http://$LAN_IP:8765/" LAN_TRANSFER_STUN=1 \
            LAN_TRANSFER_SCREENSHOTS=/tmp/lt-shots node tests/test_lan_transfer_browser.cjs
          NODE_PATH=/tmp/lt-browser/node_modules LAN_TRANSFER_URL="http://$LAN_IP:8765/" \
            LAN_TRANSFER_SCREENSHOTS=/tmp/lt-shots node tests/test_lan_speed_browser.cjs

      - name: Upload LAN transfer screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lan-transfer-screenshots
          path: /tmp/lt-shots
          if-no-files-found: ignore
          retention-days: 14

      - name: Download OpenWrt ImageBuilder
        run: |
          VER="${{ github.event.inputs.openwrt_version || '24.10.2' }}"
          FILE="openwrt-imagebuilder-${VER}-ramips-mt7621.Linux-x86_64.tar.zst"
          fetched=0
          # CDN 连接停滞时有界退出，改用 OpenWrt 官方镜像；下载后必须核对 SHA-256。
          for HOST in https://downloads.openwrt.org https://mirror-03.infra.openwrt.org; do
            BASE="$HOST/releases/${VER}/targets/${TARGET}"
            echo "Downloading: $BASE/$FILE"
            if curl -4 -fsSL --connect-timeout 20 --max-time 60 -o imagebuilder.sha256sums "$BASE/sha256sums" \
              && curl -4 -fsSI --connect-timeout 20 --max-time 60 -o imagebuilder.headers "$BASE/$FILE"; then
              SIZE=$(awk 'tolower($1) == "content-length:" { gsub("\r", "", $2); print $2 }' imagebuilder.headers | tail -n1)
              case "$SIZE" in ''|*[!0-9]*) continue ;; esac
              [ "$SIZE" -gt 0 ] || continue
              PART_DIR=$(mktemp -d)
              PART_SIZE=$(( (SIZE + 3) / 4 ))
              PIDS=()
              for PART in 0 1 2 3; do
                FIRST=$(( PART * PART_SIZE ))
                LAST=$(( FIRST + PART_SIZE - 1 ))
                [ "$LAST" -lt "$SIZE" ] || LAST=$(( SIZE - 1 ))
                curl -4 -fsSL --connect-timeout 20 --max-time 900 --speed-limit 16384 --speed-time 60 \
                  --retry 2 --retry-delay 5 --range "$FIRST-$LAST" -o "$PART_DIR/$PART" "$BASE/$FILE" &
                PIDS+=("$!")
              done
              DOWNLOADED=1
              for PID in "${PIDS[@]}"; do
                wait "$PID" || DOWNLOADED=0
              done
              [ "$DOWNLOADED" = 1 ] || continue
              cat "$PART_DIR/0" "$PART_DIR/1" "$PART_DIR/2" "$PART_DIR/3" > imagebuilder.tar.zst
              [ "$(stat -c %s imagebuilder.tar.zst)" = "$SIZE" ] || continue
              EXPECTED=$(awk -v file="$FILE" '$2 == file || $2 == "*" file { print $1 }' imagebuilder.sha256sums)
              if [ -n "$EXPECTED" ] && printf '%s  imagebuilder.tar.zst\n' "$EXPECTED" | sha256sum -c -; then
                fetched=1
                break
              fi
            fi
          done
          [ "$fetched" = 1 ] || { echo '无法下载并校验 OpenWrt ImageBuilder' >&2; exit 1; }
          tar --zstd -xf imagebuilder.tar.zst
          mv "openwrt-imagebuilder-${VER}-ramips-mt7621.Linux-x86_64" ib

      - name: Include custom files overlay
        run: |
          mkdir -p ib/files
          cp -r files/* ib/files/
          chmod 0755 ib/files/etc/init.d/lan-transfer ib/files/etc/uci-defaults/92-lan-transfer \
            ib/files/usr/share/lan-transfer/stun.uc ib/files/usr/share/lan-transfer/www/cgi-bin/api \
            ib/files/usr/share/lan-transfer/www/cgi-bin/speed
          # stamp the firmware version into the overlay
          FWV="${{ github.event.inputs.fw_version || '2.12.0' }}"
          echo "$FWV" > ib/files/etc/campus-fix-version
          sed -i "s|^echo \".*\" > /etc/campus-fix-version|echo \"$FWV\" > /etc/campus-fix-version|"             ib/files/etc/uci-defaults/99-campus-fix-banner
          echo "firmware version: $FWV"

      - name: Fetch third-party packages (luci-theme-argon)
        run: |
          # Argon is not in the official 24.10 luci feed (only bootstrap/
          # material/openwrt are). Pull the release ipk from upstream; it is
          # arch-independent (_all) and ucode-based, verified compatible with
          # 24.10 LuCI. Place it where ImageBuilder picks up local packages.
          mkdir -p ib/packages/local
          curl -fL --retry 3 -o ib/packages/local/luci-theme-argon_2.4.7_all.ipk \
            "https://github.com/jerrykuku/luci-theme-argon/releases/download/v2.4.7/luci-theme-argon_2.4.7_all.ipk"
          ls -la ib/packages/local/

      - name: Validate custom nftables rules
        run: |
          # nft -c catches syntax errors (e.g. the v2.2.0 'hash' vs
          # 'jhash' bug) BEFORE they brick fw4 on first boot.
          sudo apt-get install -y nftables
          shopt -s nullglob
          rc=0
          for f in ib/files/etc/nftables.d/*.nft; do
            echo "checking $f"
            # wrap drop-in chains in a scratch table so standalone chain
            # blocks parse. Run inside a fresh network namespace with
            # CAP_NET_ADMIN: nft still opens a netlink socket even with -c,
            # which plain CI runners deny.
            { echo "table inet fw4check {"; cat "$f"; echo "}"; } > /tmp/check.nft
            if ! sudo unshare --net nft -c -f /tmp/check.nft; then
              echo "SYNTAX ERROR in $f" >&2
              rc=1
            fi
          done
          exit $rc

      - name: Build firmware
        working-directory: ib
        run: |
          PKGS=""
          if [ "${{ github.event.inputs.include_luci || 'true' }}" = "true" ]; then
            PKGS="luci"
            # Argon theme (from local packages/ dir) + Simplified Chinese
            # UI. base-zh-cn covers luci-base/mod-*; the other two cover
            # the bundled apps. luci-i18n auto-lang: uci-defaults below
            # sets zh-cn as default.
            PKGS="$PKGS luci-theme-argon luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn luci-i18n-package-manager-zh-cn"
          fi
          # v2.10.3: curl —— 反「代理行为」检测的关键依赖。uclient-fetch 无
          # --header/--cookie，认证请求永远缺 ABMS cookie/Referer/XHR 头集，
          # 在 S-GDPI 眼里就是「第三方认证客户端」。curl 支持完整浏览器头集
          # + cookie jar（-c/-b 同一 jar 即浏览器语义）+ --compressed 透明
          # 解压（quickauth 应答是 gzip）。带 zlib（LIBCURL_ZLIB default y）
          # 与 ca-bundle（已在镜像里），增量约 +400KB。
          PKGS="$PKGS kmod-ipt-nat ip6tables-nft iptables-nft curl"
          # 邻传：独立 uhttpd + ucode CGI，include_luci=false 时也能用；socket 模块给内网 STUN 应答器
          PKGS="$PKGS uhttpd ucode ucode-mod-fs ucode-mod-socket"
          make image \
            PROFILE="$PROFILE" \
            PACKAGES="$PKGS" \
            FILES=files/

      - name: List artifacts
        run: find ib/bin/targets -type f \( -name "*.bin" -o -name "*.manifest" -o -name "sha256sums" \) -exec ls -lh {} \;

      - name: Rename artifacts with firmware version
        run: |
          # campus-fix vX.Y.Z 前缀：下载下来一眼可辨版本（breed 刷机界面
          # 只显示文件名，原名一串 openwrt-24.10.2-ramips-... 容易刷错包）
          FWV="${{ github.event.inputs.fw_version || '2.12.0' }}"
          cd ib/bin/targets/*/*/
          for f in openwrt-*-xiaomi_redmi-router-ac2100-*.bin \
                   openwrt-*-xiaomi_redmi-router-ac2100.manifest; do
            [ -f "$f" ] || continue
            mv "$f" "campus-fix-v${FWV}-${f}"
          done
          # sha256sums 原条目引用旧文件名，对新名重生成
          sha256sum campus-fix-v*.bin > sha256sums
          cat sha256sums
          ls -lh campus-fix-v*

      - name: Verify LAN transfer files and packages in the image
        run: |
          cd ib/bin/targets/*/*/
          for pkg in uhttpd ucode ucode-mod-fs ucode-mod-socket; do
            grep -q "^$pkg - " ./*.manifest || { echo "manifest 缺少 $pkg" >&2; exit 1; }
          done
          work=$(mktemp -d)
          tar -xf ./campus-fix-v*-squashfs-sysupgrade.bin -C "$work"
          root=$(find "$work" -type f -name root | head -n1)
          for f in etc/init.d/lan-transfer etc/config/lan-transfer etc/uci-defaults/92-lan-transfer \
                   usr/share/lan-transfer/stun.uc usr/share/lan-transfer/www/index.html usr/share/lan-transfer/www/app.js \
                   usr/share/lan-transfer/www/qr.js usr/share/lan-transfer/www/style.css usr/share/lan-transfer/www/cgi-bin/api \
                   usr/share/lan-transfer/www/speed.html usr/share/lan-transfer/www/speed.js usr/share/lan-transfer/www/cgi-bin/speed \
                   usr/share/luci/menu.d/luci-app-lan-transfer.json usr/share/rpcd/acl.d/luci-app-lan-transfer.json \
                   usr/share/ucitrack/lan-transfer.json www/luci-static/resources/view/lan-transfer.js www/luci-static/resources/view/lan-speed.js; do
            unsquashfs -cat "$root" "$f" > "$work/check" || { echo "镜像缺少 $f" >&2; exit 1; }
            cmp "$work/check" "$GITHUB_WORKSPACE/files/$f" || { echo "镜像内容与仓库不一致：$f" >&2; exit 1; }
          done
          unsquashfs -lls "$root" usr/lib/ucode/socket.so | grep -q 'socket\.so' || { echo "镜像缺少 socket.so" >&2; exit 1; }
          unsquashfs -lls "$root" etc/init.d/lan-transfer usr/share/lan-transfer/stun.uc usr/share/lan-transfer/www/cgi-bin/api \
            usr/share/lan-transfer/www/cgi-bin/speed \
            | awk '$1 ~ /^-/ { print; if ($1 !~ /^-rwx/) bad = 1 } END { exit bad }'
          echo "邻传文件、权限与依赖包已在镜像内核对"

      - name: Package LAN transfer and speed test add-on
        run: python3 tools/package_lan_transfer.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rm2100-firmware-v${{ github.event.inputs.fw_version || '2.12.0' }}-openwrt-${{ github.event.inputs.openwrt_version || '24.10.2' }}
          path: |
            ib/bin/targets/*/*/campus-fix-v*-xiaomi_redmi-router-ac2100-squashfs-kernel1.bin
            ib/bin/targets/*/*/campus-fix-v*-xiaomi_redmi-router-ac2100-squashfs-rootfs0.bin
            ib/bin/targets/*/*/campus-fix-v*-xiaomi_redmi-router-ac2100-squashfs-sysupgrade.bin
            ib/bin/targets/*/*/campus-fix-v*-xiaomi_redmi-router-ac2100.manifest
            ib/bin/targets/*/*/sha256sums
            firmware-out/lan-transfer-addon.tar.gz
            firmware-out/lan-transfer-addon.tar.gz.sha256
          retention-days: 30
