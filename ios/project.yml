name: RemoteWOL
options:
  bundleIdPrefix: com.rm2100
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  RemoteWOL:
    type: application
    platform: iOS
    sources:
      - RemoteWOL
    info:
      path: RemoteWOL/Info.plist
      properties:
        CFBundleDisplayName: 远程开机
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rm2100.remotewol
        PRODUCT_NAME: RemoteWOL
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  RemoteWOLTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RemoteWOLTests
    dependencies:
      - target: RemoteWOL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rm2100.remotewol.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RemoteWOL:
    build:
      targets:
        RemoteWOL: all
        RemoteWOLTests: [test]
    test:
      config: Debug
      targets:
        - RemoteWOLTests
